# Test 2026-08-12 at 02:24:58

name: Docker Silicon Compiler
run-name: btreeList

on:
  push:
    paths:
      - '**/dockerSiliconCompiler.yml'

jobs:
  build:
    permissions:
      contents: read
      packages: write                                                                                                   # Needed for GHCR push

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install base packages
      run: |
        cat << 'EOF' > Dockerfile
        FROM ubuntu:latest

        ENV DEBIAN_FRONTEND=noninteractive
        ENV TZ=Etc/UTC

        RUN apt-get update;
        RUN apt-get install -y -q tzdata python3-dev python3-pip python3-venv curl git build-essential sudo   iverilog openjdk-25-jdk-headless tree yosys gh; rm -rf /var/lib/apt/lists/*;

        RUN useradd  -u 1000 -g 1000 -ms /bin/bash phil
        USER phil
        WORKDIR /home/phil

        RUN python3 -m venv ./sc; ./sc/bin/pip install --upgrade pip; ./sc/bin/pip install siliconcompiler; ./sc/bin/sc-install openroad klayout yosys sv2v netgen opensta verible

        ENV PATH=/home/phil/sc/bin:/home/phil/.local/bin/:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        CMD ["/bin/bash", "--login"]
        EOF

    - name: Local - log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Local - Build Docker image
      run: |
        docker build -t ghcr.io/philiprbrenan/sc_local:latest .

    - name: Local - push Docker image to GHCR
      run: |
        docker push ghcr.io/philiprbrenan/sc_local:latest
    - name: Github - change userid
      run: |
        cat << 'EOF' > Dockerfile
        FROM ghcr.io/philiprbrenan/sc_local:latest
        USER root
        RUN groupmod -g 1001 phil && usermod -u 1001 phil && chown -R 1001:1001 /home/phil

        USER phil
        WORKDIR /home/phil
        EOF

    - name: GitHub - log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: GitHub - build Docker image
      run: |
        docker build -t ghcr.io/philiprbrenan/sc_github:latest .

    - name: GitHub - push Docker image to GHCR
      run: |
        docker push ghcr.io/philiprbrenan/sc_github:latest
  test:
    needs: build
    if: github.event_name == 'push' && needs.build.result == 'success'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/philiprbrenan/sc_github:latest
      options: --privileged --user=phil

    permissions:
      contents: write

    steps:
    - name: Show identities
      run: |
        id
        id phil
        ls -ld /__w

    - name: Checkout code
      uses: actions/checkout@v4

    - name: test container
      run: |
        pip show siliconcompiler
        python3 -c 'import siliconcompiler; print(siliconcompiler.__version__)'
