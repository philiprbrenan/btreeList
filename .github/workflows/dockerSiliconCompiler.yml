name: Docker Silicon Compiler
run-name: btreeList

on:
  push:
    paths:
      - '**/dockerSiliconCompiler.yml'

jobs:
  build_github:
    permissions:
      contents: read
      packages: write                                                                                                   # Needed for GHCR push

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 'Install silicon compiler in a docker container based on: https://docs.siliconcompiler.com/en/stable/user_guide/installation.html'
      run: |
        cat << 'EOF' > Dockerfile
        FROM ubuntu:22.04

        ENV DEBIAN_FRONTEND=noninteractive
        ENV TZ=Etc/UTC

        #RUN apt-get update; apt-get install -y tzdata python3-dev python3-pip python3-venv curl git build-essential sudo   iverilog openjdk-25-jdk-headless tree yosys gh; rm -rf /var/lib/apt/lists/*;
        RUN groupadd -g 1001 phil;
        RUN useradd  -u 1001 -g 1001 -ms /bin/bash phil
        RUN mkdir -p /etc/sudoers.d
        RUN echo "phil ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/phil
        RUN cat /etc/passwd | grep phil
        RUN cat /etc/group  | grep phil
        RUN id phil
        USER 1001:1001                                                                                                      # Everything below runs as phil with a numeric id appropriate to the target environment
        WORKDIR /home/phil

        RUN python3 -m venv ./sc; ./sc/bin/pip install --upgrade pip; ./sc/bin/pip install siliconcompiler; ./sc/bin/sc-install openroad klayout yosys sv2v netgen opensta verible || true

        ENV PATH=/home/phil/sc/bin:/home/phil/.local/bin/:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        CMD ["/bin/bash", "--login"]
        EOF

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: |
        docker build -t ghcr.io/philiprbrenan/sc_github:latest .

    - name: Push Docker image to GHCR
      run: |
        docker push ghcr.io/philiprbrenan/sc_github:latest
  test:
    needs: build_github
    if: github.event_name == 'push' && needs.build_github.result == 'success'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/philiprbrenan/sc_github:latest
      options: --privileged --user=phil

    permissions:
      contents: write

    steps:
    - name: Show identities
      run: |
        id
        id phil
        ls -ld /__w

    - name: Checkout code
      uses: actions/checkout@v4

    - name: test container
      run: |
        pip show siliconcompiler
        python3 -c 'import siliconcompiler; print(siliconcompiler.__version__)'
