# Test 2026-08-11 at 20:31:57

name: Test
run-name: btreeList

on:
  push:
    paths:
      - '**/main.yml'

jobs:

  test:
    permissions: write-all
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/philiprbrenan/btree:latest
      options: --privileged

    strategy:
      fail-fast: false
      matrix:
        task: [Program_1]

    steps:
    - uses: actions/checkout@v6
      with:
        ref: 'main'

    - name: Position files in package
      run: |
        mkdir -p verilog com/AppaApps/Silicon
        cp BitSet.java Branch.java Gds.java Leaf.java Lef.java Program.java Slots.java Test.java Tree.java com/AppaApps/Silicon
        tree --prune -I '*.class'

    - name: PodMan state
      run: |
        grep '^Cap' /proc/self/status
        #podman run --rm --privileged --cgroups=disabled  alpine true
        #podman run --rm --privileged --cgroups=disabled  --userns=keep-id ghcr.io/philiprbrenan/sc:latest true
        id
        podman info
        podman version

    - name: Java
      run: |
        java --version
        javac --version
        javac -g -d Classes -cp Classes com/AppaApps/Silicon/*.java

    - name: Program_1
      if: ${{             matrix.task == 'Program_1' }}
      run: |
        java -XX:+UseZGC -cp Classes com/AppaApps/Silicon/Program 1
        tree --prune -I '*.class'

    - name: Upload Program_1
      if: ${{ always() && matrix.task == 'Program_1' }}
      uses: actions/upload-artifact@v7
      with:
        name: Program_1
        path: verilog/log/*
        if-no-files-found: ignore
  release:
    needs: test
    if: github.event_name == 'push' && needs.test.result == 'success'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/philiprbrenan/btree:latest
      options: --privileged

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Silicon.jar
        run: |
          javac -g -d Classes -cp Classes com/AppaApps/Silicon/*.java
          jar -v --create --file Silicon.jar -C Classes .
          pwd
          ls -lh Silicon.jar
          tree -L 2

      - name: Release JAR file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "v${{ github.run_number }}" Silicon.jar --title "Silicon v${{ github.run_number }}" --generate-notes
