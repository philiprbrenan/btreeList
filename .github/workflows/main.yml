name: btreeList
run-name: splitting slots, Verilog, SiliconCompiler

on:
  push:
    paths:
      - '**/main.yml'

jobs:

  sc:
    permissions: write-all
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/philiprbrenan/sc_github:latest
      options: --privileged  --user=phil

    strategy:
      fail-fast: false
      matrix:
        task: [Tree_1, Tree_2, Tree_3, Tree_4, Tree_5, Tree_6, Tree_7, Tree_8, Tree_9, Tree_10, Tree_11, Tree_12, Tree_13, Tree_14]

    steps:
    - uses: actions/checkout@v6
      with:
        ref: 'main'

    - name: Position files in package
      run: |
        mkdir -p verilog com/AppaApps/Silicon
        cp ArrayConstant.java BitSet.java Branch.java Gds.java Leaf.java Lef.java Program.java Ram.java Rom.java Slots.java Test.java Tree.java com/AppaApps/Silicon
        tree --prune -I '*.class'

    - name: Java
      run: |
        java --version
        javac --version
        javac -g -d Classes -cp Classes com/AppaApps/Silicon/*.java

    - name: Tree_1
      if: ${{             matrix.task == 'Tree_1' }}
      run: |
        java -XX:+UseZGC -cp Classes com/AppaApps/Silicon/Tree 1
        tree --prune -I '*.class'

    - name: Upload Tree_1
      if: ${{ always() && matrix.task == 'Tree_1' }}
      uses: actions/upload-artifact@v7
      with:
        name: sc_Tree_1
        path: |
          verilog/**
          !verilog/**/*.gzEND
        if-no-files-found: ignore

    - name: Tree_2
      if: ${{             matrix.task == 'Tree_2' }}
      run: |
        java -XX:+UseZGC -cp Classes com/AppaApps/Silicon/Tree 2
        tree --prune -I '*.class'

