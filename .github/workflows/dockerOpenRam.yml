# Install OpenRam in two containers to create identical environments locally and on github

run-name: Docker Open Ram

on:
  push:
    paths:
      - '**/dockerOpenRam.yml'

jobs:
  build:
    permissions:
      contents: read
      packages: write                                                                                                   # Needed for GHCR push

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: local - Install base packages
      run: |
        cat << 'EOF' > Dockerfile
        FROM ubuntu:20.04

        ENV DEBIAN_FRONTEND=noninteractive
        ENV TZ=America/Los_Angeles

        RUN ln -s /usr/share/zoneinfo/${TZ} /etc/localtime
        RUN echo "${TZ}" > /etc/timezone

        RUN apt-get update
        RUN apt-get --no-install-recommends -y upgrade

        ### General build dependencies ###

        RUN apt-get install --no-install-recommends -y \
            build-essential \
            git \
            ssh \
            vim \
            gosu \
            autoconf \
            automake \
            libtool \
            bison \
            flex

        # Use bash instead of dash
        RUN rm /bin/sh && ln -s /bin/bash /bin/sh

        ### Python / OpenRAM ###

        RUN apt-get install --no-install-recommends -y \
            python3 \
            python3-numpy \
            python3-scipy \
            python3-pip \
            python3-matplotlib \
            python3-venv \
            python3-sklearn \
            python3-subunit \
            python3-coverage

        ### Netgen ###

        RUN apt-get install --no-install-recommends -y \
            m4 \
            csh \
            tk \
            tk-dev \
            tcl-dev

        ### ngspice ###

        RUN apt-get install --no-install-recommends -y \
            libxaw7-dev \
            libreadline8 \
            libreadline-dev

        ### X11 ###

        RUN apt-get install --no-install-recommends -y \
            libx11-dev \
            libcairo2-dev

        ### KLayout ###

        RUN apt-get install --no-install-recommends -y \
            qt5-default \
            qtcreator \
            ruby-full \
            ruby-dev \
            python3-dev \
            qtmultimedia5-dev \
            libqt5multimediawidgets5 \
            libqt5multimedia5-plugins \
            libqt5multimedia5 \
            libqt5svg5-dev \
            libqt5designer5 \
            libqt5designercomponents5 \
            libqt5xmlpatterns5-dev \
            qttools5-dev

        ### KLayout ###

        ARG KLAYOUT_COMMIT=ea1bf40a1ee1c1c934e47a0020417503ab3d7e7e

        WORKDIR /root

        RUN git clone https://github.com/KLayout/klayout
        WORKDIR /root/klayout
        RUN git checkout ${KLAYOUT_COMMIT}
        RUN ./build.sh -qt5 -debug -j$(nproc)
        RUN cp -r bin-debug /usr/local/klayout
        RUN rm -rf /root/klayout

        ### Trilinos ###

        ARG TRILINOS_COMMIT=trilinos-release-12-12-1

        RUN apt-get update
        RUN apt-get install --no-install-recommends -y \
            cmake \
            libfftw3-dev \
            mpich \
            libblas-dev \
            liblapack-dev \
            libsuitesparse-dev \
            libfl-dev \
            openmpi-bin \
            libopenmpi-dev \
            gfortran

        WORKDIR /root

        RUN git clone --depth 1 \
            --branch ${TRILINOS_COMMIT} \
            https://github.com/trilinos/Trilinos.git

        RUN mkdir /root/Trilinos/build

        WORKDIR /root/Trilinos/build

        RUN cmake \
            -G "Unix Makefiles" \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_CXX_COMPILER=mpic++ \
            -DCMAKE_Fortran_COMPILER=mpif77 \
            -DCMAKE_CXX_FLAGS="-O3 -fPIC" \
            -DCMAKE_C_FLAGS="-O3 -fPIC" \
            -DCMAKE_Fortran_FLAGS="-O3 -fPIC" \
            -DCMAKE_INSTALL_PREFIX=/usr/local/XyceLibs/Parallel \
            -DCMAKE_MAKE_PROGRAM="make" \
            -DTrilinos_ENABLE_NOX=ON \
            -DNOX_ENABLE_LOCA=ON \
            -DTrilinos_ENABLE_EpetraExt=ON \
            -DEpetraExt_BUILD_BTF=ON \
            -DEpetraExt_BUILD_EXPERIMENTAL=ON \
            -DEpetraExt_BUILD_GRAPH_REORDERINGS=ON \
            -DTrilinos_ENABLE_TrilinosCouplings=ON \
            -DTrilinos_ENABLE_Ifpack=ON \
            -DTrilinos_ENABLE_ShyLU=ON \
            -DTrilinos_ENABLE_Isorropia=ON \
            -DTrilinos_ENABLE_AztecOO=ON \
            -DTrilinos_ENABLE_Belos=ON \
            -DTrilinos_ENABLE_Teuchos=ON \
            -DTeuchos_ENABLE_COMPLEX=ON \
            -DTrilinos_ENABLE_Amesos=ON \
            -DAmesos_ENABLE_KLU=ON \
            -DTrilinos_ENABLE_Sacado=ON \
            -DTrilinos_ENABLE_Kokkos=ON \
            -DTrilinos_ENABLE_Zoltan=ON \
            -DTrilinos_ENABLE_ALL_OPTIONAL_PACKAGES=OFF \
            -DTrilinos_ENABLE_CXX11=ON \
            -DTPL_ENABLE_AMD=ON \
            -DAMD_LIBRARY_DIRS="/usr/lib" \
            -DTPL_AMD_INCLUDE_DIRS="/usr/include/suitesparse" \
            -DTPL_ENABLE_BLAS=ON \
            -DTPL_ENABLE_LAPACK=ON \
            -DTPL_ENABLE_MPI=ON \
            /root/Trilinos

        RUN make -j4
        RUN make install

        ### Xyce ###

        ARG XYCE_COMMIT=b7bb12d81f11d8b50141262537299b09d64b5565

        WORKDIR /root

        RUN git clone https://github.com/Xyce/Xyce.git
        WORKDIR /root/Xyce
        RUN git checkout ${XYCE_COMMIT}

        RUN ./bootstrap
        RUN mkdir /root/Xyce/build

        WORKDIR /root/Xyce/build

        RUN ../configure \
            CXXFLAGS="-O3 -std=c++11" \
            ARCHDIR="/usr/local/XyceLibs/Parallel" \
            CPPFLAGS="-I/usr/include/suitesparse" \
            --enable-mpi \
            CXX=mpicxx \
            CC=mpicc \
            F77=mpif77 \
            --prefix=/usr/local/Xyce/Parallel \
            --enable-shared \
            --enable-xyce-shareable

        RUN make -j4 install

        ### ngspice ###

        ARG NGSPICE_COMMIT=032b1c32c4dbad45ff132bcfac1dbecadbd8abb0

        WORKDIR /root

        RUN git clone git://git.code.sf.net/p/ngspice/ngspice

        WORKDIR /root/ngspice

        RUN git checkout ${NGSPICE_COMMIT}
        RUN ./autogen.sh
        RUN ./configure --enable-openmp --with-readline
        RUN make
        RUN make install

        RUN rm -rf /root/ngspice

        ### Netgen ###

        ARG NETGEN_COMMIT=1.5.221

        WORKDIR /root

        RUN git clone git://opencircuitdesign.com/netgen netgen

        WORKDIR /root/netgen

        RUN git checkout ${NETGEN_COMMIT}
        RUN ./configure
        RUN make -j$(nproc)
        RUN make install

        RUN rm -rf /root/netgen

        ### Icarus Verilog ###

        RUN apt-get install --no-install-recommends -y iverilog

        ### Magic ###

        ARG MAGIC_COMMIT=8.3.363

        WORKDIR /root

        RUN git clone git://opencircuitdesign.com/magic magic

        WORKDIR /root/magic

        RUN git checkout ${MAGIC_COMMIT}
        RUN ./configure
        RUN make
        RUN make install

        RUN rm -rf /root/magic

        ########################################################################
        # OpenRAM
        ########################################################################

        ARG OPENRAM_COMMIT=stable

        WORKDIR /opt

        RUN git clone https://github.com/VLSIDA/OpenRAM.git OpenRAM
        WORKDIR /opt/OpenRAM
        RUN git checkout ${OPENRAM_COMMIT}

        ########################################################################
        # Ciel
        #
        # Ciel requires Python 3.8+ and Ubuntu 20.04 is supported.
        ########################################################################

        RUN python3 -m pip install --no-cache-dir --upgrade ciel

        ########################################################################
        # OpenRAM / PDK environment
        ########################################################################

        ENV OPENRAM_HOME=/opt/OpenRAM/compiler
        ENV OPENRAM_TECH=/opt/OpenRAM/technology
        ENV PDK_ROOT=/opt/pdk

        ENV PYTHONPATH=/opt/OpenRAM/compiler:/opt/OpenRAM/technology/sky130

        RUN mkdir -p ${PDK_ROOT}

        ########################################################################
        # Install the Sky130 PDK using OpenRAM's own pinned installation
        ########################################################################

        RUN make sky130-pdk

        ########################################################################
        # Install the OpenRAM Sky130 SRAM library and technology files
        ########################################################################

        RUN make sky130-install

        ########################################################################
        # Install OpenRAM as a Python package
        ########################################################################

        RUN make library

        ########################################################################
        # Verify the installation
        ########################################################################

        RUN test -d ${PDK_ROOT}/sky130A
        RUN test -d ${PDK_ROOT}/skywater-pdk
        RUN test -d ${PDK_ROOT}/sky130_fd_bd_sram
        RUN test -d /opt/OpenRAM/technology/sky130
        RUN python3 -c "import openram"

        ########################################################################
        # Clean up
        ########################################################################

        RUN apt-get remove -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            bison \
            flex \
            tcl-dev \
            tk-dev \
            cmake

        RUN apt-get clean
        RUN rm -rf /var/lib/apt/lists/*

        ########################################################################
        # Generic user
        ########################################################################

        RUN useradd phil
        RUN mkdir /home/phil
        RUN chown -R phil /home/phil
        RUN chgrp -R phil /home/phil

        ENV PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin

        ENV KLAYOUT_HOME=/usr/local/klayout
        ENV PATH=${PATH}:${KLAYOUT_HOME}
        #ENV LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:${KLAYOUT_HOME}

        ENV XYCE_HOME=/usr/local/Xyce/Parallel
        ENV XYCE_PATH=${XYCE_HOME}/bin
        ENV PATH=${PATH}:${XYCE_PATH}
        ENV XYCE_LIB=${XYCE_HOME}/lib

        ENV LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:${KLAYOUT_HOME}:${XYCE_LIB}

        USER phil
        WORKDIR /home/phil

        CMD ["/bin/bash"]
        EOF

    - name: local - Build Docker image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/or_local:latest .

    - name: local - push Docker image to GHCR
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/or_local:latest
  test:
    needs: build
    if: github.event_name == 'push' && needs.build.result == 'success'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/${{ github.repository_owner }}/or_github:latest
      options: --privileged --user=phil

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Test gitHub version of container
      run: |
        pip show siliconcompiler
        python3 -c 'import siliconcompiler; print(siliconcompiler.__version__)'
